[project]
name = "ingestion-service"
version = "0.1.0"
description = "T-Invest API ingestion service with historical load and streaming"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "t-tech-investments",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "aiokafka[zstd]>=0.11.0",
    "prometheus-fastapi-instrumentator>=0.9",
    "python-logging-loki>=0.3",
]

[project.scripts]
serve = "app.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
    "ruff==0.16.10",
    "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poetry]
packages = [{ include = "app" }]

[[tool.poetry.source]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
priority = "explicit"

[tool.poetry.dependencies]
t-tech-investments = { source = "tbank" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
